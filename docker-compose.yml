services:
    qdrant:
        image: qdrant/qdrant:latest
        ports:
            - "6333:6333"

    ollama:
        image: ollama/ollama:latest
        ports:
            - "11434:11434"
        environment:
            - OLLAMA_NUM_PARALLEL=1

    backend:
        build: ./backend
        ports:
            - "8000:8000"
        environment:
            - QDRANT_HOST=qdrant
            - OLLAMA_HOST=http://ollama:11434
        volumes:
            - ./backend/app:/app
        depends_on:
            - qdrant
            - ollama

    frontend:
        build: ./frontend
        ports:
            - "8501:8501"
        depends_on:
            - backend

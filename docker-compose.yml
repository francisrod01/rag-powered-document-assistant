services:
    qdrant:
        image: qdrant/qdrant:latest
        ports:
            - "6333:6333"
        volumes:
            - qdrant_storage:/qdrant/storage
        networks:
            - rag_network

    ollama:
        image: ollama/ollama:latest
        ports:
            - "11434:11434"
        volumes:
            - ollama_storage:/root/.ollama
        environment:
            - OLLAMA_NUM_PARALLEL=1
        networks:
            - rag_network

    backend:
        build: ./backend
        ports:
            - "8000:8000"
        environment:
            - QDRANT_HOST=qdrant
            - OLLAMA_HOST=http://ollama:11434
        volumes:
            - ./backend/app:/app
        depends_on:
            - qdrant
            - ollama
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
            interval: 30s
            timeout: 3s
            retries: 10
        networks:
            - rag_network

    frontend:
        build: ./frontend
        ports:
            - "8501:8501"
        depends_on:
            backend:
                condition: service_healthy
        networks:
            - rag_network

volumes:
    qdrant_storage:
    ollama_storage:

networks:
    rag_network:
        driver: bridge
